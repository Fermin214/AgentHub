[package]
name = "agenthub-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows-first local AgentHub"
default-run = "AgentHub"

[[bin]]
name = "AgentHub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agenthub-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Globalization", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }


[features]
custom-protocol = ["tauri/custom-protocol"]
